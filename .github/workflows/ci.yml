# Phase 0 quality gate (SEC-007: automated lint / static analysis / secret +
# dependency scanning / SBOM / tests on every push and pull request).
#
# ACTIVE: this workflow runs on the GitHub-hosted runner on every push to
# `main` and on every pull request. It is the CI counterpart of
# `bash scripts/ci-local.sh`, which runs the same six gates against the local
# Docker compose stack and is what we used while the repo had no remote.
#
# SEC-008 branch protection is ENFORCED on `main` (enabled 2026-10-14 after
# the repo was made public): pull request required (>= 1 approval), status
# check "quality-gate" must pass, branches kept up to date before merge, force
# pushes and branch deletion blocked. Direct pushes to main are therefore
# blocked; changes flow through PRs. This `ci.yml` is the required status check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# NOTE: no `concurrency` block. On a free private repo GitHub allocates runners
# sparsely, so runs sit queued for minutes. cancel-in-progress would let a newer
# push kill an older run that is still waiting for a runner, producing a
# "This check has no steps" denial (run cancelled before any step executed).
# We deliberately let every push/PR run to completion instead.

jobs:
  quality-gate:
    name: quality-gate
    # Version-pinned, NOT `ubuntu-latest`: GitHub retags `-latest` to a new
    # Ubuntu release on its own schedule (the 24.04 -> 26.04 move is announced
    # for November 2026: https://github.com/actions/runner-images/issues/14748),
    # which would change the toolchain without a commit. Pinning keeps the
    # runner image a reviewed decision; bumping it is then a deliberate PR.
    runs-on: ubuntu-24.04

    services:
      # Named `db` so the PHP DSN host `db` resolves via GitHub's automatic
      # service-label -> hostname mapping (official docs: "the hostname of the
      # service container is the label you configure"). No /etc/hosts hack.
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aiwebscapes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=60s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # The test suite (tests/TestCase.php, tests/Infra/BackupRestoreTest.php)
      # connects to hosts named `db` and `redis`, matching compose.yaml. On the
      # runner those names are the service-container labels, which GitHub maps
      # to the container hostnames automatically (no /etc/hosts alias needed).
      DB_DSN: 'mysql:host=127.0.0.1;dbname=aiwebscapes;charset=utf8mb4'
      TEST_DB_DSN: 'mysql:host=127.0.0.1;dbname=aiwebscapes_test;charset=utf8mb4'
      REDIS_DSN: 'tcp://127.0.0.1:6379'
      # public/index.php reads REDIS_HOST / REDIS_PORT (not REDIS_DSN) and
      # defaults the host to `redis`, which does not resolve on the runner.
      # The served-surface tests spawn a real subprocess, so this must point at
      # the runner's loopback redis service.
      REDIS_HOST: '127.0.0.1'
      REDIS_PORT: '6379'
      AI_LOCAL_BASE_URL: 'http://127.0.0.1:11434/v1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          # Full history: gitleaks-action scans commits, not just the worktree.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0, 2026-10-08
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install mysql client (used by the backup/restore drill)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      - name: Wait for MySQL to be healthy
        run: |
          for i in $(seq 1 90); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready."
              exit 0
            fi
            echo "Waiting for MySQL... ($i/90)"
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Create the test database
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS aiwebscapes_test CHARACTER SET utf8mb4;"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, 2026-06-26
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # --- Gate 1: PSR-12 -----------------------------------------------------
      - name: PSR-12 (phpcs)
        run: vendor/bin/phpcs --standard=phpcs.xml -n src tests

      # --- Gate 2: static analysis -------------------------------------------
      - name: PHPStan level 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # --- Gate 3: dependency vulnerabilities --------------------------------
      - name: Dependency vulnerabilities (composer audit)
        run: composer audit

      # --- Gate 4: SBOM -------------------------------------------------------
      # cyclonedx/cyclonedx-php-composer v6 ships as a Composer PLUGIN command
      # (CycloneDX:make-sbom); it installs no vendor/bin binary.
      - name: SBOM (CycloneDX)
        run: composer CycloneDX:make-sbom --output-format=XML --output-file=sbom.xml --spec-version=1.6 --validate

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, 2026-10-07
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: error

      # --- Gate 5: secret scan ------------------------------------------------
      # Uses the repository's .gitleaks.toml so the runner and
      # scripts/ci-local.sh apply an identical allowlist (vendor/, *.phar,
      # lockfiles, generated SBOMs - see that file for per-path rationale).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0, 2026-05-30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # GITLEAKS_LICENSE is only required for GitHub Organisation accounts;
          # add it as a repository secret if this repo is moved into an org.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # --- Gate 6: tests ------------------------------------------------------
      # phpunit.xml is strict (failOnWarning / failOnRisky / failOnDeprecation /
      # failOnNotice / failOnIncomplete), so plain `vendor/bin/phpunit` is the
      # full gate - no extra flags needed, and none that would relax it.
      - name: Tests (phpunit)
        run: vendor/bin/phpunit
