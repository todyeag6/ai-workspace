services:
  app:
    build: .
    restart: unless-stopped
    command: ['sleep', 'infinity']
    volumes:
      - '.:/app'
    working_dir: /app
    environment:
      DB_DSN: 'mysql:host=db;dbname=aiwebscapes;charset=utf8mb4'
      TEST_DB_DSN: 'mysql:host=db;dbname=aiwebscapes_test;charset=utf8mb4'
      REDIS_DSN: 'tcp://redis:6379'
      AI_LOCAL_BASE_URL: 'http://host.docker.internal:11434/v1'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Production business systems live on app_net. The scanner surface is kept
    # OFF this network by SFR-SELF-001: the deny-by-default scanner_net below
    # carries NO production service, and ScannerInfrastructureGuard refuses a
    # scan whose scope could reach db/redis (SC-7(8) Deny by Default; CISA
    # Zero Trust Maturity Model 2023 microsegmentation).

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aiwebscapes
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-P', '3306', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

# SFR-SELF-001 network segmentation (deny-by-default).
#   app_net      - production business systems (app, db, redis).
#   scanner_net  - the isolated scanner segment. It attaches to NO production
#                  service, so a scanner on it cannot reach db/redis even if a
#                  guard were bypassed (defence in depth). ScannerInfrastructure
#                  Guard asserts the scanner reports this network name; the
#                  compose declaration is the posture the guard checks.
networks:
  app_net:
    name: aiwebscapes_app_net
  scanner_net:
    name: aiwebscapes_scanner_net
    # No service is attached here in Option A (the guard enforces isolation in-
    # process). When a dedicated scanner container is introduced (plan Option B),
    # it attaches ONLY to scanner_net, never to app_net.
